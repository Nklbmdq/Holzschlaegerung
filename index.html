<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Holzschlägerung und Bringung</title>
  <style>
    :root{
      --bg:#f7f9fb;
      --accent: #2c8a2c; /* grün für die Überschrift */
      --text:#0f1724;
      --muted:#4b5563;
      font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, "Helvetica Neue", Arial;
    }
    html,body{height:100%;}
    body{
      margin:0;
      display:flex;
      align-items:center;
      justify-content:center;
      background:var(--bg);
      color:var(--text);
      padding:32px;
    }
    .card{
      background:white;
      padding:32px 28px;
      border-radius:12px;
      box-shadow:0 6px 24px rgba(12,20,40,0.06);
      max-width:760px;
      width:100%;
      text-align:center;
    }
    h1{
      margin:0 0 12px 0;
      font-size:36px;
      line-height:1.05;
      color:var(--accent);
      font-weight:700;
    }
    h2{
      margin:0 0 18px 0;
      font-size:20px; /* mittlere Größe */
      color:var(--text);
      font-weight:600;
    }
    .contact{
      margin-top:18px;
      font-size:16px;
      color:var(--muted);
    }
    .contact a{color:var(--text); text-decoration:none}
    .label{display:block; font-weight:700; color:var(--text); margin-top:10px}
    /* kleine Notiz für den Benutzer */
    .note{margin-top:14px; font-size:13px; color:#6b7280}
    /* responsive */
    @media (max-width:480px){
      h1{font-size:28px}
      h2{font-size:18px}
    }
  </style>
</head>
<body>
  <main class="card">
    <!-- Wichtig: Wenn du die Texte ändern willst, such nach den IDs: #main-title, #subtitle, #address, #email, #phone -->
    <h1 id="main-title">Holzschlägerung und Bringung</h1>
    <h2 id="subtitle">Was geht um meine firma</h2>

    <div class="contact">
      <span class="label">Adresse</span>
      <div id="address">Musterstraße 12, 1010 Wien</div>

      <span class="label">E‑Mail</span>
      <div id="email"><a href="mailto:info@beispiel.at">info@beispiel.at</a></div>

      <span class="label">Telefon</span>
      <div id="phone"><a href="tel:+4312345678">+43 1 234 56 78</a></div>

      
    </div>
  </main>
</body>
</html>
